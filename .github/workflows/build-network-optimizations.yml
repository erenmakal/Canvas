name: Build-Network-Optimizations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-network-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate feature patch syntax
        shell: bash
        run: |
          set -euo pipefail
          for patch in canvas-server/minecraft-patches/features/*.patch; do
            echo "Parsing ${patch}"
            git apply --numstat "${patch}" >/dev/null
          done

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply patches
        run: ./gradlew applyAllPatches

      - name: Build paperclip JAR
        run: ./gradlew createPaperclipJar

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: canvas-network-optimizations
          path: canvas-server/build/libs/*paperclip*.jar
          if-no-files-found: error
          retention-days: 7
